[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage-agent"
version = "0.1.0"
description = "Multi-agent system that routes, prioritises and drafts replies for customer support tickets, with guardrails, human-in-the-loop review and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meghana Ganapa" }]
dependencies = [
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
triage = "triage.cli:main"
triage-eval = "triage.evaluate:main"
triage-mcp = "triage.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
