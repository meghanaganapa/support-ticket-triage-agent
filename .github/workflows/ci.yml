name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (includes the evaluation regression gate)
        run: pytest -q
      - name: Evaluation report (offline; the locked test set is reported, never tuned on)
        run: python -m triage.evaluate --dataset all >> "$GITHUB_STEP_SUMMARY"
